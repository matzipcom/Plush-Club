<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#fffdf8">
	<title>한입지도 | 전국 맛집 지도</title>
	<link rel="icon" type="image/svg+xml" href="./favicon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
	<style>
		:root {
			color-scheme: light;
			--ink: #202b25;
			--muted: #78827b;
			--paper: #fffdf8;
			--line: #e9e9e2;
			--tomato: #ed5b43;
			--leaf: #2e7657;
			--lemon: #f5d96c;
			font-family: "Noto Sans KR", sans-serif;
			font-synthesis: none;
		}
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: var(--paper); }
		button, input { font: inherit; }
		button { color: inherit; }
		.app { height: 100vh; min-height: 0; display: flex; flex-direction: column; }
		.topbar {
			height: 74px; padding: 0 34px; display: flex; align-items: center; gap: 34px;
			background: rgba(255,253,248,.96); border-bottom: 1px solid var(--line); z-index: 500;
		}
		.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: 0 0 auto; }
		.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 13px 13px 13px 4px; background: var(--tomato); color: white; font-size: 22px; transform: rotate(-4deg); }
		.brand-name { font: 26px/1 "Jua", sans-serif; letter-spacing: 0; }
		.brand-name span { color: var(--tomato); }
		.top-search { height: 42px; max-width: 470px; flex: 1; position: relative; }
		.top-search input { width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 0 44px 0 42px; outline: none; background: #f7f7f1; font-size: 14px; }
		.top-search input:focus { border-color: #9cb4a4; background: #fff; }
		.search-icon { position: absolute; left: 14px; top: 11px; font-size: 17px; color: #78827b; }
		.search-hint { position: absolute; right: 12px; top: 10px; color: #9aa19c; font-size: 12px; }
		.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
		.text-button, .add-button { height: 40px; border: 0; border-radius: 7px; background: transparent; padding: 0 13px; font-weight: 700; font-size: 13px; cursor: pointer; }
		.text-button:hover { background: #f3f2eb; }
		.add-button { background: var(--ink); color: white; padding: 0 16px; }
		.add-button:hover { background: #384b3e; }
		.main { display: grid; grid-template-columns: 380px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); flex: 1; min-height: 0; }
		.sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--paper); border-right: 1px solid var(--line); z-index: 400; }
		.side-heading { padding: 26px 24px 16px; }
		.eyebrow { color: var(--leaf); font-size: 11px; font-weight: 800; letter-spacing: 0; }
		h1 { margin: 7px 0 4px; font: 27px/1.3 "Jua", sans-serif; letter-spacing: 0; }
		.subheading { margin: 0; color: var(--muted); font-size: 13px; }
		.region-row { display: flex; gap: 7px; padding: 0 20px 17px; overflow-x: auto; scrollbar-width: none; }
		.region-row::-webkit-scrollbar { display: none; }
		.region-chip { white-space: nowrap; border: 1px solid var(--line); border-radius: 20px; padding: 7px 12px; background: white; color: #5f6b63; font-size: 12px; cursor: pointer; }
		.region-chip:hover { border-color: #a9c1b2; }
		.region-chip.active { border-color: var(--ink); background: var(--ink); color: white; }
		.list-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
		.result-count { font-size: 12px; font-weight: 700; }
		.sort-select { border: 0; background: transparent; color: #657069; font-size: 12px; outline: none; cursor: pointer; }
		.place-list { overflow-y: auto; flex: 1; padding: 5px 16px 18px; }
		.place-card { position: relative; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 13px; width: 100%; padding: 14px 8px; border-bottom: 1px solid #efefe9; border-radius: 6px; }
		.place-card:hover, .place-card.selected { background: #f4f6ef; }
		.place-open { display: grid; grid-column: 1 / -1; grid-row: 1; grid-template-columns: 84px minmax(0, 1fr); gap: 13px; width: 100%; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; }
		.place-open:focus-visible, .save:focus-visible { outline: 2px solid var(--leaf); outline-offset: 3px; }
		.place-photo { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 5px; background: #f7e8d1; font-size: 36px; }
		.place-card:nth-child(3n+2) .place-photo { background: #e6eee0; }
		.place-card:nth-child(3n) .place-photo { background: #f4e3df; }
		.place-info { min-width: 0; padding-top: 1px; }
		.place-topline { display: flex; align-items: center; gap: 6px; }
		.place-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; font-weight: 800; }
		.save { position: absolute; top: 14px; right: 8px; z-index: 1; padding: 2px; border: 0; background: transparent; color: #a5aaa4; font-size: 18px; cursor: pointer; }
		.save.saved { color: var(--tomato); }
		.place-category { margin-top: 5px; color: #747e77; font-size: 11px; }
		.place-rating { margin-top: 8px; font-size: 12px; font-weight: 700; }
		.place-rating span { color: #e69b25; }
		.place-meta { margin-top: 4px; color: #858e87; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.map-area { min-width: 0; min-height: 0; position: relative; background: #e6eee5; }
		#map { position: absolute; inset: 0; z-index: 1; }
		.map-caption { position: absolute; z-index: 400; left: 18px; bottom: 17px; padding: 8px 11px; border-radius: 4px; background: rgba(255,253,248,.95); color: #657069; font-size: 11px; box-shadow: 0 1px 5px #26332222; }
		.map-controls { position: absolute; top: 16px; right: 17px; z-index: 400; display: flex; flex-direction: column; gap: 8px; }
		.map-control { width: 40px; height: 40px; border: 1px solid #e4e6df; border-radius: 6px; background: #fffdf8; box-shadow: 0 2px 6px #26332218; font-size: 17px; cursor: pointer; }
		.map-control:hover { background: white; }
		.leaflet-container { font-family: "Noto Sans KR", sans-serif; }
		.leaflet-control-attribution { font-size: 9px !important; }
		.food-marker { width: 37px; height: 37px; display: grid; place-items: center; border: 2px solid white; border-radius: 50% 50% 50% 5px; background: var(--tomato); color: white; box-shadow: 0 2px 8px #1f302b55; font-size: 17px; transform: rotate(-45deg); }
		.food-marker span { transform: rotate(45deg); }
		.food-marker.active { width: 43px; height: 43px; background: var(--ink); }
		.map-popup { min-width: 150px; }
		.map-popup strong { font-size: 14px; }
		.map-popup p { margin: 4px 0 0; color: #707a73; font-size: 11px; }
		.empty-state { padding: 40px 18px; color: var(--muted); text-align: center; font-size: 13px; }
		.toast { position: fixed; z-index: 1000; left: 50%; bottom: 26px; transform: translate(-50%, 12px); padding: 11px 17px; border-radius: 6px; background: var(--ink); color: white; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s ease; }
		.toast.show { transform: translate(-50%, 0); opacity: 1; }
		@media (max-width: 780px) {
			.app { height: auto; min-height: 100vh; }
			.topbar { height: 62px; padding: 0 15px; gap: 14px; }
			.brand-mark { width: 34px; height: 34px; font-size: 19px; }
			.brand-name { font-size: 22px; }
			.top-search { height: 38px; }
			.top-search input { padding-left: 35px; font-size: 12px; }
			.search-icon { left: 11px; top: 9px; font-size: 15px; }
			.search-hint, .text-button { display: none; }
			.add-button { width: 38px; height: 38px; padding: 0; font-size: 0; }
			.add-button::after { content: "+"; font-size: 22px; }
			.main { display: flex; flex-direction: column; min-height: calc(100vh - 62px); }
			.map-area { order: 0; min-height: 48vh; height: 48vh; }
			.sidebar { order: 1; min-height: 52vh; border-right: 0; }
			.side-heading { padding: 19px 18px 12px; }
			h1 { font-size: 24px; }
			.region-row { padding-left: 15px; padding-right: 15px; }
			.list-toolbar { padding-left: 18px; padding-right: 18px; }
			.place-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 10px 12px 24px; align-content: start; }
			.place-card { display: block; padding: 7px; border: 1px solid var(--line); background: white; }
			.place-open { grid-template-columns: 1fr; gap: 7px; }
			.save { top: 116px; right: 10px; }
			.place-photo { width: 100%; height: 104px; font-size: 34px; }
			.place-info { width: 100%; padding: 2px 3px 4px; }
			.place-name { font-size: 13px; }
			.place-category, .place-meta { font-size: 10px; }
			.place-rating { margin-top: 5px; font-size: 11px; }
			.save { font-size: 16px; }
		}
		@media (max-width: 390px) {
			.topbar { gap: 9px; }
			.brand-name { font-size: 19px; }
			.brand { gap: 6px; }
			.place-list { grid-template-columns: 1fr; }
			.place-open { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; }
			.place-photo { width: 76px; height: 76px; }
			.save { top: 10px; right: 9px; }
		}
	</style>
</head>
<body>
	<div class="app">
		<header class="topbar">
			<a class="brand" href="#" aria-label="한입지도 홈">
				<span class="brand-mark" aria-hidden="true">한</span>
				<span class="brand-name">한입<span>지도</span></span>
			</a>
			<label class="top-search">
				<span class="search-icon" aria-hidden="true">⌕</span>
				<input id="search" type="search" placeholder="음식, 가게 이름, 지역을 검색해요" aria-label="맛집 검색">
				<span class="search-hint">전국 맛집 찾기</span>
			</label>
			<nav class="top-actions" aria-label="주 메뉴">
				<button class="text-button" id="saved-filter" type="button">♡ 저장한 맛집</button>
				<button class="add-button" id="add-place" type="button">+ 맛집 제보</button>
			</nav>
		</header>
		<main class="main">
			<aside class="sidebar" aria-label="맛집 목록">
				<section class="side-heading">
					<div class="eyebrow">ONE BITE, EVERYWHERE</div>
					<h1>오늘은 어디서<br>한입할까요?</h1>
					<p class="subheading">전국 곳곳, 동네 사람들이 찾는 맛집</p>
				</section>
				<div class="region-row" id="regions" aria-label="지역 선택"></div>
				<div class="list-toolbar">
					<span class="result-count" id="result-count"></span>
					<select class="sort-select" aria-label="정렬 기준" id="sort">
						<option value="rating">평점 높은 순</option>
						<option value="name">가게 이름 순</option>
					</select>
				</div>
				<div class="place-list" id="place-list"></div>
			</aside>
			<section class="map-area" aria-label="대한민국 맛집 지도">
				<div id="map"></div>
				<div class="map-controls">
					<button class="map-control" id="locate" type="button" title="대한민국 전체 보기" aria-label="대한민국 전체 보기">⌖</button>
					<button class="map-control" id="zoom-in" type="button" title="확대" aria-label="확대">＋</button>
					<button class="map-control" id="zoom-out" type="button" title="축소" aria-label="축소">−</button>
				</div>
				<div class="map-caption">대한민국 곳곳의 한입 기록 <span aria-hidden="true">·</span> 지도 데이터 © OpenStreetMap</div>
			</section>
		</main>
	</div>
	<div class="toast" id="toast" role="status" aria-live="polite"></div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script>
		const places = [
			{ id: 1, name: "을지로 골목식당", category: "한식 · 제육볶음", region: "서울", rating: 4.8, reviews: 328, address: "서울 중구 을지로", food: "🍲", lat: 37.5665, lng: 126.991 },
			{ id: 2, name: "광장시장 빈대떡", category: "전 · 막걸리", region: "서울", rating: 4.7, reviews: 512, address: "서울 종로구 창경궁로", food: "🥞", lat: 37.5701, lng: 126.9997 },
			{ id: 3, name: "해운대 바다국밥", category: "돼지국밥 · 수육", region: "부산", rating: 4.9, reviews: 241, address: "부산 해운대구 중동", food: "🍜", lat: 35.1631, lng: 129.1635 },
			{ id: 4, name: "남포동 씨앗호떡", category: "간식 · 호떡", region: "부산", rating: 4.6, reviews: 687, address: "부산 중구 남포길", food: "🥯", lat: 35.0988, lng: 129.0293 },
			{ id: 5, name: "동성로 납작만두", category: "분식 · 만두", region: "대구", rating: 4.7, reviews: 193, address: "대구 중구 동성로", food: "🥟", lat: 35.8692, lng: 128.5961 },
			{ id: 6, name: "전주 왱이콩나물국밥", category: "한식 · 콩나물국밥", region: "전주", rating: 4.8, reviews: 394, address: "전북 전주시 완산구", food: "🍚", lat: 35.8174, lng: 127.148 },
			{ id: 7, name: "수원 화성갈비", category: "고기 · 돼지갈비", region: "수원", rating: 4.9, reviews: 276, address: "경기 수원시 팔달구", food: "🥩", lat: 37.2849, lng: 127.0194 },
			{ id: 8, name: "강릉 초당순두부", category: "한식 · 순두부", region: "강릉", rating: 4.6, reviews: 188, address: "강원 강릉시 초당동", food: "🍲", lat: 37.7915, lng: 128.914 },
			{ id: 9, name: "제주 돌담 흑돼지", category: "고기 · 흑돼지", region: "제주", rating: 4.8, reviews: 421, address: "제주 제주시 애월읍", food: "🍖", lat: 33.462, lng: 126.328 },
			{ id: 10, name: "대전 성심당 본점", category: "베이커리 · 빵", region: "대전", rating: 4.9, reviews: 1024, address: "대전 중구 대종로", food: "🥐", lat: 36.3275, lng: 127.4272 },
			{ id: 11, name: "인천 신포닭강정", category: "치킨 · 닭강정", region: "인천", rating: 4.7, reviews: 582, address: "인천 중구 우현로", food: "🍗", lat: 37.4738, lng: 126.6248 },
			{ id: 12, name: "여수 낭만포차 해물삼합", category: "해산물 · 삼합", region: "여수", rating: 4.8, reviews: 307, address: "전남 여수시 하멜로", food: "🦐", lat: 34.7406, lng: 127.746 }
		];
		const regions = ["전체", "서울", "부산", "대구", "인천", "대전", "수원", "강릉", "전주", "여수", "제주"];
		const map = L.map("map", { zoomControl: false, scrollWheelZoom: true }).setView([36.3, 127.8], 7);
		L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
			maxZoom: 19,
			attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
		}).addTo(map);

		const list = document.getElementById("place-list");
		const regionRow = document.getElementById("regions");
		const markerById = new Map();
		let activeRegion = "전체";
		let selectedId = null;
		let savedOnly = false;
		const savedIds = new Set(JSON.parse(localStorage.getItem("hanip-saved") || "[]"));

		regions.forEach((region) => {
			const chip = document.createElement("button");
			chip.type = "button";
			chip.className = `region-chip${region === activeRegion ? " active" : ""}`;
			chip.textContent = region;
			chip.addEventListener("click", () => {
				activeRegion = region;
				regionRow.querySelectorAll(".region-chip").forEach((item) => item.classList.toggle("active", item.textContent === region));
				renderPlaces();
				const regionalPlaces = places.filter((place) => region === "전체" || place.region === region);
				if (regionalPlaces.length === 1) selectPlace(regionalPlaces[0].id, true);
				else if (regionalPlaces.length > 1) map.fitBounds(L.latLngBounds(regionalPlaces.map((place) => [place.lat, place.lng])).pad(0.35));
				else if (region === "전체") showKorea();
			});
			regionRow.appendChild(chip);
		});

		places.forEach((place) => {
			const icon = L.divIcon({ className: "", html: `<div class="food-marker" id="marker-${place.id}"><span>${place.food}</span></div>`, iconSize: [37, 37], iconAnchor: [18, 35] });
			const marker = L.marker([place.lat, place.lng], { icon }).addTo(map);
			marker.bindPopup(`<div class="map-popup"><strong>${place.food} ${place.name}</strong><p>${place.category} · ★ ${place.rating}</p><p>${place.address}</p></div>`);
			marker.on("click", () => selectPlace(place.id, false));
			markerById.set(place.id, marker);
		});

		function renderPlaces() {
			const query = document.getElementById("search").value.trim().toLowerCase();
			const sort = document.getElementById("sort").value;
			let visible = places.filter((place) => {
				const matchesRegion = activeRegion === "전체" || place.region === activeRegion;
				const matchesQuery = !query || `${place.name} ${place.category} ${place.region} ${place.address}`.toLowerCase().includes(query);
				return matchesRegion && matchesQuery && (!savedOnly || savedIds.has(place.id));
			});
			visible = [...visible].sort((a, b) => sort === "rating" ? b.rating - a.rating : a.name.localeCompare(b.name, "ko"));
			document.getElementById("result-count").textContent = `맛집 ${visible.length}곳`;
			list.replaceChildren();
			if (visible.length === 0) {
				const empty = document.createElement("div");
				empty.className = "empty-state";
				empty.textContent = "아직 등록된 맛집이 없어요. 다른 지역을 둘러보세요!";
				list.appendChild(empty);
			}
			visible.forEach((place) => {
				const card = document.createElement("article");
				card.className = `place-card${selectedId === place.id ? " selected" : ""}`;
				card.innerHTML = `<button class="place-open" type="button" aria-label="${place.name}, 지도에서 보기"><span class="place-photo" aria-hidden="true">${place.food}</span><span class="place-info"><span class="place-topline"><span class="place-name">${place.name}</span></span><span class="place-category">${place.category} · ${place.region}</span><span class="place-rating"><span>★</span> ${place.rating} <span style="color:#929a94;font-weight:400">(${place.reviews})</span></span><span class="place-meta">${place.address}</span></span></button><button class="save${savedIds.has(place.id) ? " saved" : ""}" type="button" aria-label="${savedIds.has(place.id) ? "저장 취소" : "맛집 저장"}" aria-pressed="${savedIds.has(place.id)}">${savedIds.has(place.id) ? "♥" : "♡"}</button>`;
				card.addEventListener("click", (event) => {
					if (event.target.closest(".save")) {
						event.stopPropagation();
						toggleSaved(place.id);
						return;
					}
					  if (event.target.closest(".place-open")) selectPlace(place.id, true);
				});
				list.appendChild(card);
			});
			places.forEach((place) => {
				const markerElement = document.getElementById(`marker-${place.id}`);
				if (markerElement) {
					markerElement.style.display = visible.some((item) => item.id === place.id) ? "grid" : "none";
					markerElement.classList.toggle("active", selectedId === place.id);
				}
			});
		}

		function selectPlace(id, openPopup) {
			const place = places.find((item) => item.id === id);
			if (!place) return;
			selectedId = id;
			renderPlaces();
			map.flyTo([place.lat, place.lng], Math.max(map.getZoom(), 12), { duration: 0.6 });
			if (openPopup) markerById.get(id).openPopup();
		}

		function toggleSaved(id) {
			if (savedIds.has(id)) savedIds.delete(id);
			else savedIds.add(id);
			localStorage.setItem("hanip-saved", JSON.stringify([...savedIds]));
			renderPlaces();
		}

		function showKorea() {
			map.fitBounds([[33, 124.5], [38.7, 131.2]], { padding: [20, 20] });
		}

		function showToast(message) {
			const toast = document.getElementById("toast");
			toast.textContent = message;
			toast.classList.add("show");
			window.setTimeout(() => toast.classList.remove("show"), 2400);
		}

		document.getElementById("search").addEventListener("input", renderPlaces);
		document.getElementById("sort").addEventListener("change", renderPlaces);
		document.getElementById("saved-filter").addEventListener("click", (event) => {
			savedOnly = !savedOnly;
			event.currentTarget.textContent = savedOnly ? "♥ 저장한 맛집" : "♡ 저장한 맛집";
			event.currentTarget.style.color = savedOnly ? "var(--tomato)" : "";
			renderPlaces();
		});
		document.getElementById("add-place").addEventListener("click", () => showToast("맛집 제보 기능은 곧 만날 수 있어요!"));
		document.getElementById("locate").addEventListener("click", showKorea);
		document.getElementById("zoom-in").addEventListener("click", () => map.zoomIn());
		document.getElementById("zoom-out").addEventListener("click", () => map.zoomOut());
		renderPlaces();
		showKorea();
	</script>
</body>
</html>
